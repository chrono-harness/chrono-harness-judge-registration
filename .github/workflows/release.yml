name: Release chrono-judge-registration
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release branch
        shell: bash
        run: |
          set -euo pipefail
          source_oid=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            test "$source_oid" = "$(git rev-parse refs/remotes/origin/main)"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+-[0-9A-Za-z.-]+$ ]]; then
            git merge-base --is-ancestor "$source_oid" refs/remotes/origin/dev
          else
            echo "Unsupported release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
  build:
    needs: source
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and exercise the release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path crates/judge-registration/Cargo.toml
          "$CARGO_TARGET_DIR/release/chrono-judge-registration" --version
          binary="$CARGO_TARGET_DIR/release/chrono-judge-registration"
          registry='{"projects":[],"scripts":[{"id":"example","actions":{"verify":{"operation":"example.check","tool":"python3","argv":["check.py"]}}}]}'
          "$binary" execution-methods <<< "$registry" | jq -e '.["example.check"] == [{"owner":"script:example","operation":"example.check","tool":"python3","argv":["check.py"]}]'
          "$binary" test-owners <<< "$registry" | jq -e '. == {}'
          code=0
          "$binary" execution-methods <<< '{}' 2>"$RUNNER_TEMP/registration-error" || code=$?
          test "$code" = 2
          grep -Fx 'projects collection missing' "$RUNNER_TEMP/registration-error"
          mkdir "$RUNNER_TEMP/dist"
          cp "$CARGO_TARGET_DIR/release/chrono-judge-registration" "$RUNNER_TEMP/dist/chrono-judge-registration-$PLATFORM"
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install_args: http:chrono-harness
      - name: Exercise classification and installed judge binding with the pinned runner
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/dist/chrono-judge-registration-$PLATFORM"
          "$binary" worktree-inputs-v1 <<< '{"operation":"nonartifact-paths","config":{"artifacts":[{"path":".chrono-harness/state/"}]},"paths":["src/demo.rs",".chrono-harness/state/run"]}' | jq -e '.paths == ["src/demo.rs"]'
          install_dir="$RUNNER_TEMP/registration-install"
          host="$RUNNER_TEMP/registration-host"
          mkdir -p "$install_dir" "$host/.chrono-harness/bin"
          image="$install_dir/chrono-judge-registration"
          cp "$binary" "$image"
          ln -s "$image" "$host/.chrono-harness/bin/chrono-judge-registration"
          digest=$(shasum -a 256 "$binary" | cut -d' ' -f1)
          version=$("$binary" --version)
          cd "$host"
          jq -cn --arg sha "$digest" --arg version "${version##* }" '{
            operation:"bound-judge-path", binding:{
              id:"initial-registration", executable:".chrono-harness/bin/chrono-judge-registration",
              version:$version, sha256:$sha, argv:["--protocol","chrono-initial-judge/v1"],
              selector:"every-initial", after:[], modes:["inventory"]
            }}' | chrono-harness judge-evidence-v1 |
            jq -es --arg image "$(cd "$install_dir" && pwd -P)/chrono-judge-registration" '. == [{Ok:$image}]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Publish binaries and their checksums
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum chrono-judge-registration-macos-aarch64 chrono-judge-registration-linux-x86_64 > SHA256SUMS
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes "${flags[@]}" \
            chrono-judge-registration-macos-aarch64 chrono-judge-registration-linux-x86_64 SHA256SUMS
