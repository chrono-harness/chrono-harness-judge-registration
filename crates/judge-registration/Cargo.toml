[package]
name = "chrono-judge-registration"
version = "0.1.17"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "chrono-judge-registration"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vstd = "=0.0.0-2026-11-22-0344"
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
sha2 = "0.11"
digest-io = "0.1"
hex = "0.4"
serde_jcs = "=0.4.0"
serde_json = { version = "1", features = ["raw_value"] }
serde = { version = "1", features = ["derive"] }
time = { version = "=0.3.55", features = ["parsing"] }

[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
