[package]
name = "chrono-judge-registration-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
vstd = "=0.0.0-2026-04-20-1748"
chrono-registration-fixture = { path = "../registration-fixture" }
chrono-judge-registration = { path = "../judge-registration" }
verus_builtin_macros = "=0.0.0-2026-04-20-1748"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "registration_contract"
path = "tests/registration_contract.rs"

[[test]]
name = "languages"
path = "tests/languages.rs"

[[test]]
name = "verified_nodes"
path = "tests/verified_nodes.rs"

[[test]]
name = "verified_scheduling"
path = "tests/verified_scheduling.rs"

[[test]]
name = "verified_readiness"
path = "tests/verified_readiness.rs"

[[test]]
name = "verified_input_coverage"
path = "tests/verified_input_coverage.rs"

[profile.dev.package.sha2]
opt-level = 3

[[bin]]
name = "chrono-harness-test-cli"
path = "tests/support/runner_cli.rs"
test = false
bench = false

[[test]]
name = "verified_snapshot_header"
path = "tests/verified_snapshot_header.rs"

[[test]]
name = "verified_snapshot_records"
path = "tests/verified_snapshot_records.rs"

[[test]]
name = "impact_views"
path = "tests/impact_views.rs"

[[test]]
name = "reference_syntax"
path = "tests/reference_syntax.rs"

[[test]]
name = "verified_path_components"
path = "tests/verified_path_components.rs"
